plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

android {
    namespace 'com.lig7oo7.bookscan'
    compileSdk 34

    defaultConfig {
        applicationId "com.lig7oo7.bookscan"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    // 고정 서명키: 새 버전을 받아도 지우지 않고 바로 덮어 설치 가능
    signingConfigs {
        fixed {
            storeFile rootProject.file('keystore/bookscan.keystore')
            storePassword 'bookscan1234'
            keyAlias 'bookscan'
            keyPassword 'bookscan1234'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.guava:listenablefuture:1.0'
    // kotlin-stdlib 버전 충돌(jdk7/jdk8 중복) 정리
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
